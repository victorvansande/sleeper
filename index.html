var K = 'sleeper-key:' + P.salt;
function b64(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
async function show(key) { var pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.iv) }, key, b64(P.ct)); var html = new TextDecoder().decode(pt); document.open(); document.write(html); document.close(); }
async function derive(pw) { var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']); return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(P.salt), iterations: P.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']); }

(async function () { try { var s = localStorage.getItem(K); if (s) { var key = await crypto.subtle.importKey('raw', b64(s), 'AES-GCM', true, ['decrypt']); await show(key); } } catch (e) { try { localStorage.removeItem(K); } catch (x) {} } })();
document.getElementById('f').addEventListener('submit', async function (e) {
  e.preventDefault(); var go = document.getElementById('go'), err = document.getElementById('err'); go.disabled = true; go.textContent = 'Bezig…'; err.textContent = '';
  try { var key = await derive(document.getElementById('pw').value);
    if (document.getElementById('rem').checked) { var raw = new Uint8Array(await crypto.subtle.exportKey('raw', key)); try { localStorage.setItem(K, btoa(String.fromCharCode.apply(null, raw))); } catch (x) {} }
    await show(key);
