var K = 'sleeper-key:' + P.salt;
function b64(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
// document.open() is ignored while this page is still being parsed, and the dashboard would then be appended
// below the form, so wait until parsing has finished before replacing the page.
function parsed() { return new Promise(function (r) { if (document.readyState !== 'loading') setTimeout(r, 0); else document.addEventListener('DOMContentLoaded', function () { setTimeout(r, 0); }, { once: true }); }); }
